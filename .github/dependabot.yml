# Dependabot runs on GitHub's side on its own schedule (a GitHub-managed job, not a workflow
# in this repo) and does not use this repo's Actions minutes. This repo has no
# .github/workflows, so there is no "github-actions" entry; add one with the first workflow.
version: 2
updates:
  # .pre-commit-config.yaml pins its hooks to a release; this keeps those pins current. Every
  # release-age delay is 7 days. Dependabot has no security updates for pre-commit, so every
  # hook bump waits the full cooldown.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
